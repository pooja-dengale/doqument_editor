<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}AjaiaDoc{% endblock %}</title>
  <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #1a1a2e;
      --surface:  #16162a;
      --surface2: #1e1e3a;
      --border:   #2e2e4e;
      --accent:   #6366f1;
      --accent-h: #4f52d4;
      --text:     #e2e8f0;
      --muted:    #64748b;
      --danger:   #f87171;
      --success:  #10b981;
      --warn:     #f59e0b;
    }

    body {
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; flex-direction: column;
    }

    /* ── Header ─────────────────────────────────────────────────────────── */
    header {
      height: 54px; background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; flex-shrink: 0; position: sticky; top: 0; z-index: 50;
    }
    .brand {
      font-size: 18px; font-weight: 800; color: var(--text);
      text-decoration: none; display: flex; align-items: center; gap: 8px;
    }
    .header-right { display: flex; align-items: center; gap: 12px; }

    .user-chip {
      display: flex; align-items: center; gap: 8px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 20px; padding: 4px 12px 4px 4px;
    }
    .user-avatar {
      width: 26px; height: 26px; border-radius: 50%; background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 800; color: #fff;
    }
    .user-name { font-size: 13px; font-weight: 600; color: var(--text); }

    .hbtn {
      border: 1px solid var(--border); background: transparent;
      color: var(--muted); border-radius: 7px; padding: 6px 14px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      text-decoration: none; display: inline-flex; align-items: center;
      transition: all .15s;
    }
    .hbtn:hover { color: var(--text); border-color: var(--muted); }
    .hbtn-accent { background: var(--accent); color: #fff; border-color: var(--accent); }
    .hbtn-accent:hover { background: var(--accent-h); border-color: var(--accent-h); color: #fff; }

    /* ── Auth pages ─────────────────────────────────────────────────────── */
    .auth-page {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 32px 16px;
    }
    .auth-box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 40px 36px; width: 420px; max-width: 100%;
      display: flex; flex-direction: column; gap: 22px;
    }
    .auth-title { font-size: 26px; font-weight: 800; text-align: center; }
    .auth-sub   { font-size: 14px; color: var(--muted); text-align: center; margin-top: 4px; }

    .auth-alert {
      padding: 11px 14px; border-radius: 8px; font-size: 13px; font-weight: 500;
    }
    .auth-alert-error { background: #2d1515; color: var(--danger); border: 1px solid #5a1e1e; }

    .field-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .field-group:last-of-type { margin-bottom: 20px; }
    .field-group label {
      font-size: 12px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .06em; color: var(--muted);
    }
    .optional { font-size: 10px; font-weight: 400; color: #475569; text-transform: none; }
    .field-group input {
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); padding: 10px 13px; font-size: 14px; outline: none;
      transition: border-color .15s;
    }
    .field-group input:focus { border-color: var(--accent); }
    .field-error { font-size: 12px; color: var(--danger); margin-top: 2px; }

    .auth-btn {
      width: 100%; padding: 11px; background: var(--accent); color: #fff;
      border: none; border-radius: 8px; font-size: 15px; font-weight: 700;
      cursor: pointer; transition: background .15s;
    }
    .auth-btn:hover { background: var(--accent-h); }

    .auth-switch { text-align: center; font-size: 13px; color: var(--muted); }
    .auth-switch a { color: var(--accent); text-decoration: none; font-weight: 600; }
    .auth-switch a:hover { text-decoration: underline; }

    /* ── App layout ─────────────────────────────────────────────────────── */
    .app-body { display: flex; flex: 1; overflow: hidden; height: calc(100vh - 54px); }

    /* ── Sidebar ─────────────────────────────────────────────────────────── */
    .sidebar {
      width: 235px; min-width: 235px; background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .sidebar-head {
      padding: 12px 14px 10px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 6px;
      flex-shrink: 0;
    }
    .sidebar-head-title {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .1em; color: var(--muted);
    }
    .sidebar-actions { display: flex; gap: 5px; }
    .btn-new {
      background: var(--accent); color: #fff; border: none; border-radius: 5px;
      padding: 4px 10px; font-size: 11px; font-weight: 700; cursor: pointer;
      text-decoration: none; display: inline-flex; align-items: center;
    }
    .btn-import {
      background: var(--surface2); color: var(--muted); border: 1px solid var(--border);
      border-radius: 5px; padding: 4px 8px; font-size: 11px; font-weight: 600; cursor: pointer;
    }

    .section-label {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .1em; color: #334155; padding: 10px 14px 4px; flex-shrink: 0;
    }
    .doc-list { list-style: none; margin: 0; padding: 0; overflow-y: auto; }
    .doc-item a {
      display: flex; align-items: center; gap: 8px; padding: 7px 14px;
      text-decoration: none; color: var(--muted); font-size: 13px;
      border-left: 3px solid transparent; transition: background .12s;
    }
    .doc-item a:hover { background: var(--surface2); }
    .doc-item.active a {
      background: #2e2e4e; border-left-color: var(--accent);
      color: var(--text); font-weight: 600;
    }
    .perm-badge {
      font-size: 9px; font-weight: 700; text-transform: uppercase;
      border-radius: 3px; padding: 1px 4px; margin-left: auto; flex-shrink: 0;
    }
    .perm-badge.edit { background: #052e16; color: #34d399; }
    .perm-badge.view { background: #292215; color: var(--warn); }
    .sidebar-empty { font-size: 12px; color: #334155; padding: 6px 14px; }

    /* ── Editor pane ─────────────────────────────────────────────────────── */
    .editor-pane { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .editor-toolbar {
      display: flex; align-items: center; gap: 10px; padding: 10px 18px;
      border-bottom: 1px solid var(--border); background: var(--surface); flex-shrink: 0;
    }
    .title-input {
      flex: 1; background: transparent; border: none;
      border-bottom: 1px solid var(--border);
      color: var(--text); font-size: 17px; font-weight: 700; padding: 3px 0; outline: none;
    }
    .title-input:disabled { opacity: .5; cursor: not-allowed; }
    .btn-save {
      background: var(--accent); color: #fff; border: none; border-radius: 6px;
      padding: 6px 18px; font-size: 13px; font-weight: 700; cursor: pointer;
    }
    .btn-save:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }
    .btn-share {
      background: var(--surface2); color: var(--muted); border: 1px solid var(--border);
      border-radius: 6px; padding: 6px 14px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .badge-view {
      font-size: 11px; color: var(--warn); background: #292215;
      border-radius: 4px; padding: 3px 7px; font-weight: 600;
    }
    .editor-wrap { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    #quill-editor { flex: 1; overflow-y: auto; }
    .editor-footer {
      display: flex; gap: 20px; align-items: center; padding: 7px 18px;
      border-top: 1px solid var(--border); background: var(--surface);
      font-size: 11px; color: var(--muted); flex-wrap: wrap; flex-shrink: 0;
    }
    .status-saved { color: var(--success); font-weight: 600; }
    .status-error { color: var(--danger);  font-weight: 600; }

    /* ── Empty state ─────────────────────────────────────────────────────── */
    .empty-state {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px; color: var(--muted);
    }
    .empty-state .ei { font-size: 52px; opacity: .3; }
    .empty-state p { font-size: 14px; }

    /* ── Share modal ─────────────────────────────────────────────────────── */
    .modal-backdrop {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.65);
      z-index: 1000; align-items: center; justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 12px; width: 460px; max-width: 95vw; padding: 24px;
      display: flex; flex-direction: column; gap: 18px;
      box-shadow: 0 24px 48px rgba(0,0,0,.5);
    }
    .modal-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .modal-title  { font-size: 16px; font-weight: 700; }
    .modal-doc    { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .btn-close    {
      background: transparent; border: none; color: var(--muted);
      font-size: 18px; cursor: pointer; padding: 2px 6px;
    }
    .share-form { display: flex; gap: 8px; flex-wrap: wrap; }
    select {
      background: var(--surface); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 7px 10px; font-size: 13px; outline: none;
      cursor: pointer; flex: 1; min-width: 120px;
    }
    .btn-share-add {
      background: var(--accent); color: #fff; border: none; border-radius: 6px;
      padding: 7px 16px; font-size: 13px; font-weight: 700; cursor: pointer;
    }
    .btn-share-add:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }
    .share-list { border-top: 1px solid var(--border); padding-top: 14px; }
    .share-row {
      display: flex; align-items: center; gap: 10px; padding: 8px 0;
      border-bottom: 1px solid var(--bg);
    }
    .s-avatar {
      width: 30px; height: 30px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; color: #fff; flex-shrink: 0;
    }
    .share-info { flex: 1; }
    .share-name { font-size: 13px; font-weight: 500; }
    .share-perm { font-size: 11px; color: var(--muted); }
    .btn-revoke {
      background: transparent; border: 1px solid var(--border);
      color: var(--danger); border-radius: 4px; padding: 3px 10px;
      font-size: 11px; cursor: pointer;
    }

    /* ── Quill dark theme ────────────────────────────────────────────────── */
    .ql-toolbar.ql-snow   { background: var(--surface2); border-color: var(--border) !important; }
    .ql-container.ql-snow { background: var(--bg); border-color: var(--border) !important; flex: 1; }
    .ql-editor { color: var(--text); font-size: 15px; line-height: 1.7; min-height: 300px; padding: 20px 28px; }
    .ql-editor.ql-blank::before { color: var(--muted); font-style: normal; }
    .ql-toolbar .ql-stroke { stroke: var(--muted) !important; }
    .ql-toolbar .ql-fill   { fill: var(--muted)   !important; }
    .ql-toolbar .ql-picker-label { color: var(--muted) !important; }
    .ql-toolbar button:hover .ql-stroke,
    .ql-toolbar button.ql-active .ql-stroke { stroke: #a5b4fc !important; }
  </style>
</head>
<body>

<header>
  <a href="{% url 'editor-home' %}" class="brand">📝 AjaiaDoc</a>
  <div class="header-right">
    {% if user.is_authenticated %}
      <div class="user-chip">
        <div class="user-avatar">{{ user.username|first|upper }}</div>
        <span class="user-name">{{ user.username }}</span>
      </div>
      <form method="post" action="{% url 'logout' %}" style="margin:0">
        {% csrf_token %}
        <button type="submit" class="hbtn">Log out</button>
      </form>
    {% else %}
      <a href="{% url 'login' %}"  class="hbtn">Log in</a>
      <a href="{% url 'signup' %}" class="hbtn hbtn-accent">Sign up</a>
    {% endif %}
  </div>
</header>

{% block body %}{% endblock %}

<script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
