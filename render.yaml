services:
  # ── Django REST API ──────────────────────────────────────────────────────
  - type: web
    name: ajaia-docs-api
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn ajaia_docs.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: ajaia_docs.settings_prod
      - key: SECRET_KEY
        generateValue: true          # Render auto-generates a secure value
      - key: ALLOWED_HOSTS
        value: ajaia-docs-api.onrender.com
      - key: FRONTEND_URL
        value: https://doqument-editor.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: ajaia-docs-db
          property: connectionString
    healthCheckPath: /api/users/

  # ── PostgreSQL database ──────────────────────────────────────────────────
databases:
  - name: ajaia-docs-db
    databaseName: ajaia_docs
    user: ajaia_docs_user
    plan: free
