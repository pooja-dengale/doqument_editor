services:
  - type: web
    name: ajaia-docs-api
    runtime: python
    buildCommand: "chmod +x build.sh && ./build.sh"
    startCommand: "DJANGO_SETTINGS_MODULE=ajaia_docs.settings_prod gunicorn ajaia_docs.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: ajaia_docs.settings_prod
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "ajaia-docs-api-dnt2.onrender.com,.onrender.com,localhost"

databases:
  - name: ajaia-docs-db
    databaseName: ajaia_docs
    user: ajaia_docs_user
    plan: free
